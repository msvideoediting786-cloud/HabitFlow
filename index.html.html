<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HabitFlow</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#e8e0ff;--bg2:#ffe3f1;--ink:#3b3560;--card:#f5f1ff;--on:#3b3560;--a:#ff86b4;--b:#8fd8ff;--c:#a8efc0;--d:#ffd982;--e:#c9b3ff;--sd:rgba(120,98,190,.30);--sl:rgba(255,255,255,.95);--ih:rgba(255,255,255,.7);--is:rgba(90,70,160,.10);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2a2350;--bg2:#3a2750;--ink:#f1ecff;--card:#40386c;--sd:rgba(8,4,28,.6);--sl:rgba(130,110,215,.18);--ih:rgba(255,255,255,.14);--is:rgba(0,0,0,.25)}}
:root[data-theme="dark"]{--bg:#2a2350;--bg2:#3a2750;--ink:#f1ecff;--card:#40386c;--sd:rgba(8,4,28,.6);--sl:rgba(130,110,215,.18);--ih:rgba(255,255,255,.14);--is:rgba(0,0,0,.25)}
:root{--clay:8px 8px 20px var(--sd),-6px -6px 16px var(--sl),inset 5px 5px 10px var(--ih),inset -5px -5px 10px var(--is);--clays:4px 4px 10px var(--sd),-3px -3px 8px var(--sl),inset 3px 3px 6px var(--ih),inset -3px -3px 6px var(--is);--dent:inset 4px 4px 9px var(--is),inset -4px -4px 9px var(--sl)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);background-image:radial-gradient(circle at 12% 8%,var(--bg2),transparent 45%),radial-gradient(circle at 90% 70%,#bfe6ff55,transparent 40%);background-attachment:fixed;color:var(--ink);font:600 15px/1.45 'Nunito',system-ui,sans-serif}
h1,h2,h3{font-family:'Fredoka','Nunito',system-ui,sans-serif;margin:.2em 0;font-weight:600;line-height:1.15}
h2{font-size:28px}h3{font-size:19px}
header{display:flex;align-items:center;gap:12px;padding:16px;flex-wrap:wrap}
.logo{font:600 26px 'Fredoka',sans-serif;background:linear-gradient(145deg,#ffa3c6,#ff7aae);color:#3b3560;padding:6px 20px;border-radius:99px;box-shadow:var(--clay)}
.net{margin-left:auto;font-weight:800;padding:5px 14px;border-radius:99px;background:var(--c);color:var(--on);box-shadow:var(--clays)}.net.off{background:var(--d)}
nav{display:flex;gap:10px;overflow-x:auto;padding:8px 16px 16px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:linear-gradient(var(--bg) 60%,transparent)}
nav button{white-space:nowrap}
main{padding:8px 16px 70px;max-width:1100px;margin:auto}
button,input,select,textarea{font:inherit;color:inherit}
.btn,nav button,.chip{border:0;background:var(--card);padding:9px 18px;border-radius:99px;font-weight:800;cursor:pointer;box-shadow:var(--clays);transition:transform .15s,box-shadow .15s}
.btn:hover,nav button:hover,.chip:hover{transform:translateY(-2px)}
.btn:active,nav button:active,.chip:active{transform:translateY(1px);box-shadow:var(--dent)}
.btn.pri,nav button.on{background:linear-gradient(145deg,#ffa3c6,#ff7aae);color:#3b3560}.btn.alt{background:linear-gradient(145deg,#a9e3ff,#7ccdf7);color:#3b3560}.btn.dng{background:linear-gradient(145deg,#ffb0b0,#ff8a8a);color:#3b3560}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--b);outline-offset:3px}
.chip{padding:6px 15px;font-size:13px}.chip.on{background:linear-gradient(145deg,#ffe49b,#ffcf5e);color:#3b3560}
.grid{display:grid;gap:22px;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));margin:18px 0}
.card{background:var(--card);border-radius:30px;padding:20px;box-shadow:var(--clay);position:relative}
.grid>.card:nth-child(4n+1){background:linear-gradient(145deg,#cdeeff,#a9dcf7);color:var(--on)}.grid>.card:nth-child(4n+2){background:linear-gradient(145deg,#d3f8de,#a8e9bf);color:var(--on)}.grid>.card:nth-child(4n+3){background:linear-gradient(145deg,#ffeab8,#ffd47a);color:var(--on)}.grid>.card:nth-child(4n+4){background:linear-gradient(145deg,#e4d6ff,#c6adff);color:var(--on)}
.grid>.card.plain{background:var(--card);color:var(--ink)}
.big{font:600 38px 'Fredoka',sans-serif}
.sticker{position:absolute;top:-12px;right:14px;background:linear-gradient(145deg,#ffa3c6,#ff7aae);color:#3b3560;padding:3px 14px;border-radius:99px;font-weight:800;font-size:12px;box-shadow:var(--clays)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.sp{margin-left:auto}
.hrow{display:flex;gap:12px;align-items:center;border-left:10px solid var(--cc);border-radius:24px;padding:10px 12px;margin:12px 0;background:var(--card);color:var(--ink);box-shadow:var(--clays)}
.hrow.done{background:rgba(120,225,150,.32)}.hrow.partial{background:rgba(255,205,90,.34)}.hrow.missed{background:rgba(255,120,130,.24)}
.hm{flex:1;min-width:0}.hm small{display:block;opacity:.8}
.tick{width:48px;height:48px;border-radius:50%;border:0;background:var(--card);font-weight:800;font-size:15px;cursor:pointer;flex:none;box-shadow:var(--clays)}.tick:active{box-shadow:var(--dent)}.hrow.done .tick{background:linear-gradient(145deg,#c4f7d4,#85dfa4);color:#2d2a50}.tick:disabled{opacity:.4;cursor:not-allowed}
.pill{border-radius:99px;padding:2px 11px;font-size:12px;font-weight:800;background:var(--card);box-shadow:var(--clays)}
.bar{height:18px;border-radius:99px;background:var(--card);overflow:hidden;box-shadow:var(--dent)}.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#ff86b4,#ffd982);box-shadow:inset 0 3px 4px #fff7}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}.cal>i{text-align:center;font-weight:800;font-style:normal}
.dc{aspect-ratio:1;min-height:44px;border:0;border-radius:18px;background:var(--card);cursor:pointer;font-weight:800;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0;box-shadow:var(--clays)}
.dc small{font-size:10px}.dc.all{background:linear-gradient(145deg,#c4f7d4,#8fe3ab);color:var(--on)}.dc.some{background:linear-gradient(145deg,#ffeab8,#ffd47a);color:var(--on)}.dc.miss{background:linear-gradient(145deg,#ffc2c2,#ff9a9a);color:var(--on)}.dc.sel{outline:3px solid var(--a);outline-offset:2px}.dc.today{box-shadow:0 0 0 3px var(--b),var(--clays)}
.dc.none{opacity:.6}.empty{visibility:hidden}
.strip{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}.strip b{width:15px;height:15px;border-radius:50%;background:var(--card);box-shadow:var(--dent)}.strip .done{background:#7fe0a0}.strip .partial{background:#ffcf5e}.strip .missed{background:#ff8f98}
.legend span{margin-right:12px;font-size:13px}
.chart{width:100%;height:auto;color:var(--ink);max-height:200px}
label{display:block;font-weight:800;margin:10px 0}input,select,textarea{width:100%;border:0;border-radius:18px;padding:10px 14px;background:var(--card);margin-top:4px;box-shadow:var(--dent)}
input[type=checkbox]{width:auto;margin-right:6px;accent-color:#ff7aae}input[type=color]{padding:4px;height:44px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.days label{display:inline-block;margin:3px}
dialog{border:0;border-radius:34px;padding:0;width:min(520px,94vw);max-height:90vh;background:var(--card);color:var(--ink);box-shadow:16px 16px 40px rgba(40,20,90,.35),-6px -6px 20px var(--sl),inset 6px 6px 12px var(--ih)}
dialog::backdrop{background:#2a1f5a88;backdrop-filter:blur(4px)}
.mh{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;background:linear-gradient(145deg,#ffeab8,#ffd47a);color:var(--on);border-radius:34px 34px 0 0}.mb{padding:10px 20px;max-height:60vh;overflow:auto}.mf{display:flex;gap:10px;justify-content:flex-end;padding:14px 20px 20px}
.err{color:#d6204f;font-weight:800;min-height:1.2em}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 22px;border-radius:99px;font-weight:800;z-index:99;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;box-shadow:0 10px 24px rgba(40,20,90,.35)}#toast.show{opacity:1}
.slot{border-radius:24px;padding:8px 16px;margin:14px 0;background:var(--card);box-shadow:var(--dent)}
.tl{border-left:6px solid var(--a);border-radius:4px;margin-left:8px;padding-left:16px}.tl div{margin:10px 0;position:relative}.tl div:before{content:"";position:absolute;left:-28px;top:4px;width:14px;height:14px;background:var(--b);border-radius:50%;box-shadow:var(--clays)}
.badge{display:inline-block;text-align:center;border-radius:22px;padding:10px 12px;margin:6px;background:var(--card);color:var(--ink);min-width:100px;box-shadow:var(--clays)}.badge.lock{opacity:.4;filter:grayscale(1)}.badge span{font-size:30px;display:block}
.un{border-left:8px solid var(--a);padding-left:6px;border-radius:6px}.note{font-size:13px;opacity:.85}

img,svg{max-width:100%}.hm{overflow-wrap:anywhere}.hrow .hm{flex:1 1 150px}
body.out header,body.out nav,body.out main{display:none}
#auth{padding:16px}.authc{max-width:420px;margin:24px auto;text-align:center}.authc form{text-align:left}.aic{border-radius:26px;box-shadow:var(--clay)}
.logo{display:flex;align-items:center;gap:10px;padding:5px 18px 5px 8px}.logo img{border-radius:12px}
.av{border:0;padding:0;border-radius:50%;width:48px;height:48px;overflow:hidden;box-shadow:var(--clays);cursor:pointer;flex:none;display:block}.av img,.av span{width:100%;height:100%;display:flex;align-items:center;justify-content:center;object-fit:cover;font:600 20px Fredoka,sans-serif;color:#3b3560;background:linear-gradient(145deg,#ffa3c6,#c9b3ff)}.av.lg{width:120px;height:120px;cursor:default}.av.lg span{font-size:52px}
.hero{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:22px;align-items:stretch;margin:6px 0 10px}
.hero .ht{display:flex;flex-direction:column;justify-content:center;align-items:flex-start;padding:28px}
.hero h1{font-size:clamp(26px,4.5vw,40px);margin:0 0 8px}.hero p{margin:0 0 16px}
.pic{border-radius:34px;overflow:hidden;box-shadow:var(--clay);aspect-ratio:8/3;min-height:200px}.pic svg{display:block;width:100%;height:100%}
.orb{transform-box:view-box;transform-origin:400px 330px;animation:orb 30s linear infinite;animation-delay:var(--ph,0s)}@keyframes orb{to{transform:rotate(360deg)}}
.L{animation-duration:30s;animation-timing-function:linear;animation-iteration-count:infinite;animation-delay:var(--ph,0s)}
.Lm{animation-name:lm;opacity:0}.Ld{animation-name:ld}.Le{animation-name:le;opacity:0}.Ls{animation-name:ls;opacity:0}.Ln{animation-name:ln;opacity:0}
@keyframes lm{0%,66%{opacity:0}75%{opacity:1}88%,100%{opacity:0}}
@keyframes ld{0%,15%{opacity:1}22%,78%{opacity:0}90%,100%{opacity:1}}
@keyframes le{0%,15%{opacity:0}25%{opacity:1}36%,100%{opacity:0}}
@keyframes ls{0%,34%{opacity:0}42%,60%{opacity:1}70%,100%{opacity:0}}
@keyframes ln{0%,20%{opacity:0}40%,62%{opacity:.5}80%,100%{opacity:0}}
.cld{animation:dr 16s ease-in-out infinite alternate}.cld.b{animation-duration:22s}@keyframes dr{to{transform:translateX(34px)}}
.float{animation:fl 5s ease-in-out infinite}@keyframes fl{50%{transform:translateY(-6px)}}
@media(prefers-reduced-motion:reduce){.orb,.L,.cld,.float{animation:none}}
@media(max-width:760px){.hero{grid-template-columns:1fr}.pic{order:-1;aspect-ratio:2/1;min-height:0}.hero .ht{align-items:stretch}}
@media(max-width:640px){main{padding:6px 12px 70px}h2{font-size:23px}h3{font-size:17px}.big{font-size:30px}.card{padding:16px;border-radius:26px}.g2{grid-template-columns:1fr}.hrow{flex-wrap:wrap}.cal{gap:5px}.dc{border-radius:12px;min-height:38px;font-size:13px}.dc small{display:none}.chip,.btn{padding:8px 14px}header{padding:12px}.mb{max-height:55vh}dialog{border-radius:28px}.mh{border-radius:28px 28px 0 0}}

let KEY='habitflow:guest',me=null,S=DEF();

const save=()=>{if(me)sv(KEY,S)};
const cats=()=>CATS0.concat(S.cats),cat=id=>cats().find(c=>c.id==id)||CATS0[0];
let ui={view:'dash',cat:'all',cal:'month',cm:TD().slice(0,7),cw:null,sel:TD(),pd:TD(),gt:'active'};
const wk=d=>add(d,-((pd(d).getDay()+6)%7));ui.cw=wk(TD());
/* ---------- logic ---------- */
const sched=(h,d)=>d>=h.start&&h.days.includes(pd(d).getDay());
const cnt=(h,d)=>(S.logs[h.id]||{})[d]||0;
function st(h,d){if(!sched(h,d))return null;const c=cnt(h,d);if(c>=h.target)return'done';if(c>0)return'partial';return d<TD()?'missed':'pending'}
function dayStat(d){const r={n:0,dn:0,pt:0,ms:0};S.habits.forEach(h=>{const s=st(h,d);if(!s)return;r.n++;if(s=='done')r.dn++;else if(s=='partial')r.pt++;else if(s=='missed')r.ms++});return r}
function streaks(h){let run=0,lon=0,t=TD();for(let d=h.start;d<=t;d=add(d,1)){if(!sched(h,d))continue;const s=st(h,d);if(s=='done'){run++;lon=Math.max(lon,run)}else if(d!=t)run=0}return{cur:run,lon}}
function hs(h){const t=TD();let ev=0,dn=0,pt=0,ms=0;for(let d=h.start;d<=t;d=add(d,1)){if(!sched(h,d))continue;const s=st(h,d);if(s=='pending')continue;ev++;if(s=='done')dn++;else if(s=='partial')pt++;else ms++}return{ev,dn,pt,ms,rate:ev?dn/ev:null}}
function range(a,b,hl){hl=hl||S.habits;const t=TD();let n=0,dn=0,pt=0,ms=0;for(let d=a;d<=b&&d<=t;d=add(d,1))hl.forEach(h=>{const s=st(h,d);if(!s||s=='pending')return;n++;if(s=='done')dn++;else if(s=='partial')pt++;else ms++});return{n,dn,pt,ms,rate:n?dn/n:null}}
const totalDone=()=>S.habits.reduce((a,h)=>a+hs(h).dn,0);
const maxLon=()=>S.habits.reduce((a,h)=>Math.max(a,streaks(h).lon),0);
const BADGES=()=>[['first','🌟','First check-in',totalDone()>=1],['s3','🥉','3-day streak',maxLon()>=3],['s7','🥈','7-day streak',maxLon()>=7],['s30','🥇','30-day streak',maxLon()>=30],['c100','💯','100 completions',totalDone()>=100]];
function gRange(g){return[g.start,g.end]}
function gProg(g){const hl=g.habit=='all'?S.habits:S.habits.filter(h=>h.id==g.habit);return range(g.start,g.end,hl).dn}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),3200)}
function notify(t,b,key,sys,silent){if(key){if(S.fired[key])return;S.fired[key]=1}S.notifs.unshift({id:uid(),t,b,time:Date.now(),read:!!silent});S.notifs=S.notifs.slice(0,100);if(silent)return;toast(t);if(sys&&'Notification' in window&&Notification.permission==='granted'){try{new Notification(t,{body:b,tag:key||undefined})}catch(e){}}}
function checkAch(silent){BADGES().forEach(([id,ic,nm,ok])=>{if(ok&&!S.ach[id]){S.ach[id]=TD();notify(ic+' Badge unlocked: '+nm,'Keep the momentum going!','b|'+id,false,silent)}});
 S.goals.forEach(g=>{if(!g.doneAt&&gProg(g)>=g.target){g.doneAt=TD();notify('🏆 Goal achieved: '+g.title,'You reached '+g.target+' completions.','g|'+g.id,false,silent)}});save()}
function checkReminders(){const t=TD(),now=P(new Date().getHours())+':'+P(new Date().getMinutes());S.habits.forEach(h=>{if(!h.remind||!h.time||!sched(h,t)||st(h,t)=='done'||h.time>now)return;const k='r|'+h.id+'|'+t;if(S.fired[k])return;notify('⏰ '+h.name,'Scheduled for '+h.time+' today.',k,true);save();if(ui.view=='notif'||ui.view=='dash')render()})}
/* ---------- modal ---------- */
const dlg=$('#dlg');
function modal(title,body,onSave,label){dlg.innerHTML=`<div class="mh"><h3>${title}</h3><button class="btn" data-a="close" aria-label="Close">✕</button></div><div class="mb">${body}<div id="err" class="err" role="alert"></div></div><div class="mf"><button class="btn" data-a="close">Cancel</button><button class="btn pri" id="ok">${label||'Save'}</button></div>`;dlg.showModal();$('#ok').onclick=()=>{const r=onSave();if(r)$('#err').textContent=r;else{dlg.close();save();checkAch();render()}}}
const v=id=>$('#'+id,dlg).value.trim();
function habitForm(h){const e=h||{name:'',icon:'⭐',cat:'health',type:'build',target:1,days:[0,1,2,3,4,5,6],remind:false,time:'09:00',start:TD()};
 modal(h?'Edit habit':'New habit',`<label>Name<input id="f_name" maxlength="40" value="${esc(e.name)}"></label>
 <div class="g2"><label>Icon (emoji)<input id="f_icon" maxlength="4" value="${esc(e.icon)}"></label><label>Type<select id="f_type"><option value="build" ${sel(e.type,'build')}>✨ Build a habit</option><option value="break" ${sel(e.type,'break')}>🚫 Break a habit</option></select></label></div>
 <div class="g2"><label>Category<select id="f_cat">${cats().map(c=>`<option value="${c.id}" ${sel(e.cat,c.id)}>${c.icon} ${esc(c.name)}</option>`).join('')}</select></label><label>Times per day<input id="f_target" type="number" min="1" max="20" value="${e.target}"></label></div>
 <div class="days"><b>Scheduled days</b><br>${DAYS.map((d,i)=>`<label><input type="checkbox" class="dchk" value="${i}" ${e.days.includes(i)?'checked':''}>${d}</label>`).join('')}</div>
 <label>Start date<input id="f_start" type="date" value="${e.start}"></label>
 <label><input id="f_rem" type="checkbox" ${e.remind?'checked':''}>Remind me</label><label>Reminder time<input id="f_time" type="time" value="${e.time}"></label>
 <p class="note">For break-habits, a check-in means "I stayed clean today".</p>`,()=>{
  const name=v('f_name'),days=$$('.dchk',dlg).filter(x=>x.checked).map(x=>+x.value),target=+v('f_target'),start=v('f_start'),remind=$('#f_rem',dlg).checked,time=v('f_time');
  if(!name)return'Enter a habit name.';if(S.habits.some(x=>x.id!=(h&&h.id)&&x.name.toLowerCase()==name.toLowerCase()))return'A habit with this name already exists.';
  if(!days.length)return'Pick at least one scheduled day.';if(!(target>=1&&target<=20))return'Times per day must be between 1 and 20.';if(!start)return'Choose a start date.';if(remind&&!time)return'Choose a reminder time.';
  const o={name,icon:v('f_icon')||'⭐',cat:v('f_cat'),type:v('f_type'),target:Math.round(target),days,start,remind,time};
  if(h)Object.assign(h,o);else S.habits.push(Object.assign({id:uid()},o));
  if(remind)setTimeout(()=>{if('Notification' in window&&Notification.permission=='default')askPerm()},300)})}
function catForm(){modal('New category',`<label>Name<input id="c_name" maxlength="24"></label><div class="g2"><label>Icon<input id="c_icon" value="🎨" maxlength="4"></label><label>Color<input id="c_col" type="color" value="#ff3d81"></label></div>`,()=>{const n=v('c_name');if(!n)return'Enter a category name.';if(cats().some(c=>c.name.toLowerCase()==n.toLowerCase()))return'That category already exists.';S.cats.push({id:uid(),name:n,icon:v('c_icon')||'🎨',color:v('c_col')})})}
function goalForm(){modal('New goal or challenge',`<label>Title<input id="g_t" maxlength="50"></label><div class="g2"><label>Type<select id="g_ty"><option value="w">Weekly goal</option><option value="m">Monthly goal</option><option value="7">7-day challenge</option><option value="21">21-day challenge</option><option value="30">30-day challenge</option></select></label><label>Target completions<input id="g_n" type="number" min="1" max="999" value="5"></label></div><label>Habit<select id="g_h"><option value="all">All habits</option>${S.habits.map(h=>`<option value="${h.id}">${h.icon} ${esc(h.name)}</option>`).join('')}</select></label><p class="note">Weekly = this Mon–Sun. Monthly = this calendar month. Challenges start today.</p>`,()=>{
  const t=v('g_t'),ty=v('g_ty'),n=Math.round(+v('g_n'));if(!t)return'Enter a title.';if(!(n>=1))return'Target must be at least 1.';if(!S.habits.length)return'Create a habit first.';
  let a=TD(),b;if(ty=='w'){a=wk(a);b=add(a,6)}else if(ty=='m'){const d=new Date();a=ds(new Date(d.getFullYear(),d.getMonth(),1));b=ds(new Date(d.getFullYear(),d.getMonth()+1,0))}else b=add(a,+ty-1);
  S.goals.push({id:uid(),title:t,type:ty,habit:v('g_h'),target:n,start:a,end:b,doneAt:null})})}
function taskForm(t){const e=t||{title:'',slot:'morning',start:'',end:'',prio:'med'};modal(t?'Edit task':'New planner task',`<label>Task<input id="t_t" maxlength="60" value="${esc(e.title)}"></label><div class="g2"><label>Routine<select id="t_s">${['morning','afternoon','evening','night'].map(s=>`<option ${sel(e.slot,s)}>${s}</option>`).join('')}</select></label><label>Priority<select id="t_p">${['high','med','low'].map(s=>`<option ${sel(e.prio,s)}>${s}</option>`).join('')}</select></label></div><div class="g2"><label>Start<input id="t_a" type="time" value="${e.start}"></label><label>End<input id="t_b" type="time" value="${e.end}"></label></div>`,()=>{
  const n=v('t_t'),a=v('t_a'),b=v('t_b');if(!n)return'Enter a task title.';if(b&&!a)return'Add a start time or clear the end time.';if(a&&b&&b<=a)return'End time must be after the start time.';
  const day=S.plan[ui.pd]=S.plan[ui.pd]||{tasks:[],note:'',journal:''};const o={title:n,slot:v('t_s'),prio:v('t_p'),start:a,end:b};if(t)Object.assign(t,o);else day.tasks.push(Object.assign({id:uid(),done:false},o))})}
async function askPerm(){if(!('Notification' in window)){toast('This browser has no notifications. In-app reminders still work.');return}try{const r=await Notification.requestPermission();toast('Notification permission: '+r)}catch(e){toast('Your browser blocked the permission prompt here.')}render()}

function hrow(h,d,mg){const c=cat(h.cat),n=cnt(h,d),s=st(h,d),k=streaks(h);
 return `<div class="hrow ${s}" style="--cc:${c.color}"><button class="tick" data-a="tick" data-id="${h.id}" data-d="${d}" ${d>TD()?'disabled':''} aria-label="Check in ${esc(h.name)}">${s=='done'?'✔':s=='partial'?n+'/'+h.target:h.target>1?'+':'○'}</button><div class="hm"><b>${h.icon} ${esc(h.name)}</b><small>${c.icon} ${esc(c.name)} · ${h.type=='break'?'🚫 break':'✨ build'} · 🔥 ${k.cur}${h.remind?' · ⏰ '+h.time:''}${h.target>1?' · '+n+'/'+h.target:''}</small></div>${mg?`<button class="btn" data-a="edit" data-id="${h.id}" aria-label="Edit">✎</button><button class="btn dng" data-a="del" data-id="${h.id}" aria-label="Delete">🗑</button>`:`<span class="pill">${s}</span>`}</div>`}

function line(vals){const w=300,h=100,n=vals.length,pts=vals.map((v,i)=>v==null?null:[i*w/(n-1)+5,h-v*(h-10)+5]).filter(Boolean);if(pts.length<2)return'<p class="note">Not enough data yet.</p>';return`<svg viewBox="0 0 310 115" class="chart" role="img" aria-label="Trend line"><polyline points="${pts.map(p=>p.join(',')).join(' ')}" fill="none" stroke="#a98bff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>${pts.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="3" fill="#ff86b4" stroke="#fff" stroke-width="1.5"/>`).join('')}<text x="0" y="114" font-size="9" fill="currentColor">30 days ago</text><text x="262" y="114" font-size="9" fill="currentColor">today</text></svg>`}
function ring(p){const c=2*Math.PI*40;return`<svg width="110" height="110" viewBox="0 0 100 100" role="img" aria-label="${Math.round(p*100)}% done today"><circle cx="50" cy="50" r="40" fill="none" stroke="#ffffffaa" stroke-width="14"/><circle cx="50" cy="50" r="40" fill="none" stroke="#ff6fa3" stroke-width="14" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-p)}" transform="rotate(-90 50 50)"/><text x="50" y="57" text-anchor="middle" font-size="20" font-weight="700" fill="#3b3560">${Math.round(p*100)}%</text></svg>`}

const empty=`<div class="card"><h2>Start here</h2><p>You have no habits yet. Create your first one, or load demo data to explore the app.</p><button class="btn pri" data-a="new">+ New habit</button> <button class="btn alt" data-a="demo">Load demo data</button></div>`;
function vDash(){const t=TD(),ds_=dayStat(t),p=ds_.n?ds_.dn/ds_.n:0,h=new Date().getHours(),g=h<12?'Good morning':h<18?'Good afternoon':'Good evening';
 const todays=S.habits.filter(x=>sched(x,t)),tasks=((S.plan[t]||{}).tasks||[]).slice().sort((a,b)=>(a.start||'99').localeCompare(b.start||'99'));
 const best=S.habits.reduce((a,x)=>Math.max(a,streaks(x).cur),0),wr=range(wk(t),add(wk(t),6));
 const up=S.habits.filter(x=>x.remind&&sched(x,t)&&st(x,t)!='done').sort((a,b)=>a.time.localeCompare(b.time)).slice(0,4);
 return`${HERO()}<h2>${g}, ${esc(me.name.split(' ')[0])}! 👋</h2>${S.habits.length?'':empty}<div class="grid"><div class="card"><span class="sticker">TODAY</span><div class="row">${ring(p)}<div><div class="big">${ds_.dn}/${ds_.n}</div><b>habits done</b></div></div></div>${stat('Best current streak','🔥'+best,'days in a row')}${stat('This week',pct(wr.rate),wr.dn+' of '+wr.n+' completed so far')}${stat('Total completions',totalDone(),'all time')}</div>

 <div class="card plain"><h3>Upcoming reminders</h3>${up.length?up.map(x=>`<div>⏰ ${x.time} — ${x.icon} ${esc(x.name)}</div>`).join(''):'<p>No pending reminders today.</p>'}<h3 style="margin-top:14px">Badges</h3>${BADGES().map(b=>`<span class="badge ${b[3]?'':'lock'}"><span>${b[1]}</span>${b[2]}</span>`).join('')}</div></div>`}

 return`<div class="row"><h2>Habits</h2><button class="btn pri sp" data-a="new">+ New habit</button></div><div class="row" style="margin:10px 0"><button class="chip ${ui.cat=='all'?'on':''}" data-a="cat" data-c="all">All (${S.habits.length})</button>${cats().map(c=>`<button class="chip ${ui.cat==c.id?'on':''}" data-a="cat" data-c="${c.id}" style="border-color:${c.color}">${c.icon} ${esc(c.name)} (${S.habits.filter(h=>h.cat==c.id).length})</button>`).join('')}<button class="chip" data-a="newcat">+ Category</button></div>
 ${S.habits.length?(l.length?l.map(h=>hrow(h,TD(),true)).join(''):'<div class="card">No habits in this category yet.</div>'):empty}`}
function dayDetail(d){const hs_=S.habits.filter(h=>sched(h,d)),tk=((S.plan[d]||{}).tasks||[]);

function start(id){me=users()[id];if(!me)return showAuth();sv('hf_session',id);KEY='habitflow:'+id;S=Object.assign(DEF(),lg(KEY,{}));Object.assign(ui,lg('hf_ui:'+id,{}));if(!V[ui.view])ui.view='dash';
 document.body.classList.remove('out');$('#auth').innerHTML='';render();checkAch(true);checkReminders();scrollTo(0,ui.sy||0)}
function saveUI(){if(me)sv('hf_ui:'+me.id,Object.assign({},ui,{sy:scrollY}))}
function paintHdr(){$('#hav').innerHTML=me.avatar?`<img src="${me.avatar}" alt="">`:`<span>${esc(me.name[0].toUpperCase())}</span>`;$('#hav').title=me.name}
function vProfile(){const big=me.avatar?`<img src="${me.avatar}" alt="Your profile photo">`:`<span>${esc(me.name[0].toUpperCase())}</span>`;
 return`<h2>Profile</h2><div class="grid"><div class="card plain" style="text-align:center"><div class="av lg" style="margin:0 auto 12px">${big}</div><h3>${esc(me.name)}</h3><div class="note">${esc(me.email)}</div><input id="pfile" type="file" accept="image/*" hidden><div class="row" style="justify-content:center;margin-top:14px"><button class="btn alt" data-a="avatar">📷 ${me.avatar?'Change':'Add'} photo</button>${me.avatar?'<button class="btn" data-a="rmavatar">Remove</button>':''}</div></div>
 <div class="card plain"><h3>Edit name</h3><label>Display name<input id="pname" maxlength="30" value="${esc(me.name)}"></label><button class="btn pri" data-a="savename">Save name</button></div>
 <div class="card plain"><h3>Install app</h3><p class="note">Add HabitFlow to your home screen so it opens like a real app.</p><button class="btn alt" data-a="install">⬇ Install HabitFlow</button></div>
 <div class="card plain"><h3>Session</h3><p class="note">You stay signed in on this device. After a reload you land on the page you were viewing.</p><button class="btn dng" data-a="logout">Log out</button></div></div>`}
function pickImg(f){const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas'),z=192,m=Math.min(im.width,im.height);c.width=c.height=z;c.getContext('2d').drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,0,0,z,z);me.avatar=c.toDataURL('image/jpeg',.85);persistMe();render();toast('Profile photo updated')};im.onerror=()=>toast('That file is not a valid image.');im.src=r.result};r.readAsDataURL(f)}
let dip=null;addEventListener('beforeinstallprompt',e=>{e.preventDefault();dip=e});addEventListener('appinstalled',()=>{dip=null;toast('HabitFlow installed 🎉')});
async function doInstall(){if(dip){dip.prompt();try{await dip.userChoice}catch(e){}dip=null;return}
 modal('Install HabitFlow','<p>To install on Android:</p><ol><li>Open this page in <b>Chrome</b>.</li><li>Tap the <b>⋮</b> menu.</li><li>Tap <b>Install app</b> (or <b>Add to Home screen</b>).</li></ol><p class="note">Chrome creates a real app icon for you. If the option is missing, open the link directly in Chrome, not inside another app or a preview.</p>',()=>null,'Got it')}
Object.assign(A,{atab:d=>{amode=d.m;showAuth()},logout:()=>{if(confirm('Log out of HabitFlow?')){saveUI();localStorage.removeItem('hf_session');showAuth();scrollTo(0,0)}},avatar:()=>$('#pfile').click(),rmavatar:()=>{me.avatar='';persistMe();render()},savename:()=>{const n=$('#pname').value.trim();if(!n)return toast('Enter a name.');me.name=n;persistMe();render();toast('Name saved')},install:doInstall});
document.addEventListener('change',e=>{if(e.target.id=='pfile'&&e.target.files[0])pickImg(e.target.files[0])});
document.addEventListener('submit',async e=>{if(e.target.id!='af')return;e.preventDefault();const em=$('#a_e').value.trim().toLowerCase(),pw=$('#a_p').value,U=users();
 if(amode=='up'){const nm=($('#a_n').value||'').trim();if(!nm)return showAuth('Enter your name.');if(Object.values(U).some(u=>u.email==em))return showAuth('That email already has an account. Log in instead.');
  const id=uid(),salt=uid()+uid();U[id]={id,name:nm,email:em,salt,hash:await sha(salt+pw),avatar:''};sv('hf_users',U);
  if(Object.keys(U).length==1&&localStorage.getItem('habitflow'))localStorage.setItem('habitflow:'+id,localStorage.getItem('habitflow'));start(id)}
 else{const u=Object.values(U).find(x=>x.email==em);if(!u||u.hash!=await sha(u.salt+pw))return showAuth('Wrong email or password.');start(u.id)}});
let sT;addEventListener('scroll',()=>{clearTimeout(sT);sT=setTimeout(saveUI,300)},{passive:true});
function mkIcons(){const im=new Image();im.onload=()=>{try{const png=z=>{const c=document.createElement('canvas');c.width=c.height=z;c.getContext('2d').drawImage(im,0,0,z,z);return c.toDataURL('image/png')},p1=png(192),p2=png(512),u=location.href.split('#')[0];$('#ico').href=p1;const a=document.createElement('link');a.rel='apple-touch-icon';a.href=p1;document.head.appendChild(a);const m={name:'HabitFlow',short_name:'HabitFlow',start_url:u,scope:u,display:'standalone',background_color:'#e8e0ff',theme_color:'#ff86b4',icons:[{src:p1,sizes:'192x192',type:'image/png'},{src:p2,sizes:'512x512',type:'image/png',purpose:'any maskable'}]};const l=document.createElement('link');l.rel='manifest';l.href=URL.createObjectURL(new Blob([JSON.stringify(m)],{type:'application/manifest+json'}));document.head.appendChild(l)}catch(e){}};im.src=ICON}
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t||t.type=='checkbox'||t.disabled)return;const f=A[t.dataset.a];if(f)f(t.dataset,t)});
document.addEventListener('change',e=>{const t=e.target;if(t.type=='checkbox'&&t.dataset.a&&A[t.dataset.a])A[t.dataset.a](t.dataset,t);if(t.id=='pdate'&&t.value){ui.pd=t.value;render()}});
document.addEventListener('input',e=>{if(e.target.id=='pnote'||e.target.id=='pjour'){const d=S.plan[ui.pd]=S.plan[ui.pd]||{tasks:[],note:'',journal:''};d[e.target.id=='pnote'?'note':'journal']=e.target.value;save()}});
function net(){const n=$('#net');n.textContent=navigator.onLine?'● Online':'● Offline — saving locally';n.className='net'+(navigator.onLine?'':' off')}
addEventListener('online',net);addEventListener('offline',net);net();
let lastDay=TD();setInterval(()=>{if(TD()!=lastDay){lastDay=TD();render()}checkReminders()},20000);
mkIcons();{const sid=lg('hf_session',null);if(sid&&users()[sid])start(sid);else showAuth()}
